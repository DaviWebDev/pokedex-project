<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/pokeIcon.svg" type="image/svg+xml" />
    <title>Pokémon Wiki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="stylesheet" href="./css/base/reset.css" />
    <link rel="stylesheet" href="./css/base/variables.css" />
    <link rel="stylesheet" href="./css/base/global.css" />
    <link rel="stylesheet" href="./css/components/header.css" />
    <link rel="stylesheet" href="./css/pages/pokedex.css" media="print" onload="this.media = 'all'" />
    <link rel="stylesheet" href="./css/components/search-bar.css" media="print" onload="this.media = 'all'" />
    <link rel="stylesheet" href="./css/components/card.css" media="print" onload="this.media = 'all'" />
  </head>
  <body>
    <header class="header">
      <nav class="header__nav">
        <ul class="header__list">
          <li class="header__item">
            <a class="header__link" href="./index.html">Home</a>
          </li>
          <li class="header__item">
            <a class="header__link" href="./pokedex.html">PokéDex</a>
          </li>
          <li class="header__item">
            <a class="header__link" href="#">Compare</a>
          </li>
          <li class="header__item">
            <a class="header__link" href="#">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="pokedex">
      <div class="search">
        <div class="search__bar" role="search">
          <label for="search-bar" class="sr-only">Search Pokémon</label>
          <input type="search" id="search-bar" class="search__input" placeholder="Search" />
          <svg class="search__icon" aria-hidden="true">
            <use href="./assets/sprites.svg#search-icon"></use>
          </svg>
        </div>
        <div id="suggestions-container" class="search__suggestions"></div>
      </div>
      <div id="pokedex-grid" class="pokedex__grid"></div>
      <div id="pokedex-paginator" class="pokedex__paginator-container"></div>
    </main>
    <script type="module" src="./js/pokedex.js"></script>
  </body>
</html>
