<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore PokéDex complete with search, updated data direct from the pokeApi database." />
    <link rel="icon" href="./assets/pokeIcon.svg" type="image/svg+xml" />
    <title>Pokémon Wiki</title>
    <link rel="stylesheet" href="./css/style.min.css" />
  </head>
  <body>
    <header class="header">
      <nav class="header__nav">
        <ul class="header__list">
          <li class="header__item">
            <a class="header__link" href="./index.html">Home</a>
          </li>
          <li class="header__item">
            <a class="header__link" href="./pokedex.html">PokéDex</a>
          </li>
          <li class="header__item">
            <a class="header__link" href="#">Compare</a>
          </li>
          <li class="header__item">
            <a class="header__link" href="#">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <div class="search">
      <div class="search__bar" role="search">
        <label for="search-bar" class="sr-only">Search Pokémon</label>
        <input type="search" id="search-bar" class="search__input" placeholder="Search" />
        <svg class="search__icon" aria-hidden="true">
          <use href="./assets/sprites.svg#search-icon"></use>
        </svg>
        <div data-js="suggestions-container" class="search__suggestions"></div>
      </div>
    </div>
    <main data-js="pokedex-container" class="pokedex">
      <div class="loading-overlay">
        <div class="loading-overlay__spinner" aria-label="Loading..."></div>
      </div>
      <div data-js="pokedex-grid" class="pokedex__grid"></div>
      <div data-js="pokedex-paginator" class="pokedex__paginator-container"></div>
    </main>
    <script type="module" src="./js/dist/pokedex.js"></script>
  </body>
</html>
